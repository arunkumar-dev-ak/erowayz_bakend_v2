name: eroways

services:
  postgres:
    platform: linux/amd64
    image: postgis/postgis:15-3.3
    container_name: eroways_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-eroways}
    ports:
      # Host port 5435 (Mac) mapped to Container port 5432 (Postgres)
      - "${DB_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-eroways}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eroways_redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server
        fi
      '
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    ports:
      # Host port 6381 mapped to container port 6379
      # (6379: default, 6380: ecommerce/fabsol -> 6381 avoids conflict)
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: eroways_postgres_data
  redis_data:
    name: eroways_redis_data
